name: ESP32 stale-check

on:
  schedule:
    # Offset from :00/:05/:10... (GitHub deprioritizes schedule triggers
    # under load, and load concentrates on round clock marks -- observed
    # gaps of 50-130 min on the old */5 despite the 5-min config).
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

# actions: write is only for the keepalive step below.
permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-stale.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # GitHub disables scheduled workflows after 60 days without repository
      # activity; this one went silently dark from 2026-10-09 to 2026-11-25,
      # exactly 60 days after the last commit. Re-enabling an active
      # workflow is a no-op that resets that inactivity timer (the approach
      # the common keepalive actions use, without dummy commits). Not
      # provable until 60 quiet days pass, so the dashboard also warns when
      # this check's heartbeat (alert_state.last_checked_at) goes stale.
      - name: Keep the schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/stale-check.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
